# Reshape the cert-manager Certificate into the Secret istiod expects.
#
# THE PROBLEM THIS SOLVES
#   cert-manager writes : tls.crt      tls.key      ca.crt
#   istiod requires     : ca-cert.pem  ca-key.pem   root-cert.pem  cert-chain.pem
#
# The names do not match and cert-manager cannot rename them, so a plain
# Certificate cannot populate "cacerts" -- istiod would ignore it and silently
# fall back to self-signed.
#
# secretgen-controller is a core VKS component and its SecretTemplate builds one
# Secret from others with arbitrary key names, which bridges the gap without
# leaving the platform. When cert-manager renews the Certificate, this Secret is
# regenerated automatically.
#
# CAVEAT: istiod does NOT hot-reload cacerts. Renewal updates this Secret, but
# istiod keeps using the old CA in memory until restarted. Plan a restart into
# the renewal window, or accept that rotation is not automatic end to end.
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretTemplate
metadata:
  name: cacerts
  namespace: istio-system
spec:
  inputResources:
  - name: ca
    ref:
      apiVersion: v1
      kind: Secret
      name: istio-ca-keypair
  template:
    type: Opaque
    data:
      ca-cert.pem: $(.ca.data.tls\.crt)
      ca-key.pem: $(.ca.data.tls\.key)
      root-cert.pem: $(.ca.data.ca\.crt)
      cert-chain.pem: $(.ca.data.tls\.crt)
